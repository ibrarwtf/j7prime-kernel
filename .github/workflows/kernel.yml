name: kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "kernel = Image+modules+DTBs | stock-module = modules for the stock 6.15.0-exynos7870 | dtb = device trees only | stable = pmaports linux-postmarketos-stable 7.3.4 recipe + build id (arm64 runner, Alpine)"
        type: choice
        options: [kernel, stock-module, dtb, stable]
        default: kernel
      builds:
        description: "build ids, comma-separated (<dir>/<id>.fragment + on7xelte-<id>.dtsi + patches/<id>/); kernel/dtb/stable modes (stable: <dir>/<id>.fragment + patches/7.3.4/)"
        default: "b1"
      repo:
        description: "kernel git URL (kernel/dtb modes)"
        default: "https://gitlab.com/exynos7870-mainline/linux.git"
      ref:
        description: "branch, tag or commit (kernel/dtb modes)"
        default: "exynos7870/7.1"
      base_config:
        description: "base config file under kernel/"
        default: "kernel/base-6.15.config"
      build_dir:
        description: "directory holding the build ids (stable mode: kernel/7.3.4)"
        default: "kernel/7.1"
      modules:
        description: "stock-module: config symbols to build as modules, comma-separated"
        default: "CONFIG_I2C_CHARDEV"
      full_modules:
        description: "stock-module: full `make modules` (slow first run) instead of modules_prepare + per-directory build"
        type: boolean
        default: false
      qemu:
        description: "kernel mode: QEMU virt boot smoke test"
        type: boolean
        default: true
      release:
        description: "also publish a GitHub release <build>-<run_number> with the artifacts"
        type: boolean
        default: false

permissions:
  contents: write   # only used by the opt-in release steps

defaults:
  run:
    shell: bash

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  REPO: ${{ inputs.repo }}
  REF: ${{ inputs.ref }}
  BASE_CONFIG: ${{ inputs.base_config }}
  BUILD_DIR: ${{ inputs.build_dir }}
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.m.outputs.builds }}
      key: ${{ steps.m.outputs.key }}
    steps:
      - id: m
        env:
          B: ${{ inputs.builds }}
        run: |
          set -euo pipefail
          for v in "$BASE_CONFIG" "$BUILD_DIR"; do
            [[ $v =~ ^kernel/[A-Za-z0-9._/-]+$ && $v != *..* ]] || { echo "::error::'$v' must be a path under kernel/"; exit 1; }
          done
          j=$(echo "$B" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -sc .)
          echo "$j" | jq -r '.[]' | while read -r b; do
            [[ $b =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad build id '$b'"; exit 1; }
          done
          echo "builds=$j" >> "$GITHUB_OUTPUT"
          # ccache key component: one cache line per source repo+ref
          echo "key=$(echo "$REPO@$REF" | sed 's#^https\?://##; s#\.git@#@#; s#[^A-Za-z0-9._@-]#_#g')" >> "$GITHUB_OUTPUT"
          echo "builds: $j"

  kernel:
    needs: setup
    if: inputs.mode == 'kernel'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    env:
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev cpio kmod zstd device-tree-compiler ccache >/dev/null

      - name: Fetch source, apply build, configure (fails on fragment mismatch)
        run: SRC=src bash scripts/prepare-tree.sh

      - name: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-k-${{ needs.setup.outputs.key }}-${{ matrix.build }}-${{ github.run_id }}
          restore-keys: |
            ccache-k-${{ needs.setup.outputs.key }}-${{ matrix.build }}-
            ccache-k-${{ needs.setup.outputs.key }}-

      - name: Build
        run: |
          set -euo pipefail
          cd src
          export CCACHE_MAXSIZE=3G
          ccache -z >/dev/null
          make -j$(nproc) CC="ccache aarch64-linux-gnu-gcc" Image modules $(cat ../dtbs.txt) 2>&1 | tail -20
          ccache -s | tee ../ccache.txt | tail -8
          make -s kernelrelease | tee ../release.txt

      - name: Package
        run: |
          set -euo pipefail
          cd src
          mkdir -p ../out/mod
          make -s modules_install INSTALL_MOD_PATH=../out/mod INSTALL_MOD_STRIP=1
          cp arch/arm64/boot/Image ../out/
          cp arch/arm64/boot/dts/exynos/exynos7870-on7xelte*.dtb ../out/
          cp .config ../out/config
          cp ../release.txt ../source.txt ../out/
          tar -C ../out/mod -czf ../out/modules.tgz lib
          rm -rf ../out/mod
          cd ../out && sha256sum * > SHA256SUMS && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build }}
          path: out/
          retention-days: 14

      - name: Release (opt-in)
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$BUILD-${{ github.run_number }}"
          gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag ($(cat release.txt))" --notes-file source.txt

      - name: Summary
        if: always()
        run: |
          hit=$(grep -iE 'hit rate|Hits:' ccache.txt 2>/dev/null | head -1 | tr -s ' ' || true)
          {
            echo "### kernel \`$BUILD\`"
            echo "| release | commit | Image | duration | ccache |"
            echo "|---|---|---|---|---|"
            echo "| \`$(cat release.txt 2>/dev/null)\` | \`$(sed -n 's/^commit: //p' source.txt 2>/dev/null | cut -c1-12)\` $REF | $(stat -c %s out/Image 2>/dev/null) B | $(( ($(date +%s) - T0) / 60 )) min | $hit |"
          } >> "$GITHUB_STEP_SUMMARY"

  qemu:
    needs: [setup, kernel]
    if: ${{ !cancelled() && inputs.mode == 'kernel' && inputs.qemu }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.build }}
          path: k
      - name: QEMU tools + /init
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm gcc-aarch64-linux-gnu cpio >/dev/null
          mkdir -p rd
          aarch64-linux-gnu-gcc -static -Os -s -o rd/init scripts/qemu-init.c
          (cd rd && echo init | cpio -o -H newc --quiet > ../initrd.cpio)
      - name: Boot on virt
        run: |
          # The phone config has no PL011/virtio console and is not changed for this test.
          # Evidence comes from guest RAM (see scripts/qemu-smoke.py); if the config does have
          # the PL011 console the marker must also appear on ttyAMA0.
          grep -q '^CONFIG_SERIAL_AMBA_PL011_CONSOLE=y' k/config && CON=1 || CON=0
          python3 scripts/qemu-smoke.py k/Image initrd.cpio 180 $CON

  dtb:
    needs: setup
    if: inputs.mode == 'dtb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    env:
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex libssl-dev device-tree-compiler >/dev/null
      - name: Fetch source, apply build, configure
        run: SRC=src bash scripts/prepare-tree.sh
      - name: Build DTBs
        run: |
          set -euo pipefail
          cd src
          make -j$(nproc) $(cat ../dtbs.txt)
          mkdir -p ../out
          for d in $(cat ../dtbs.txt); do
            b=$(basename $d .dtb)
            cp arch/arm64/boot/dts/$d ../out/
            scripts/dtc/dtc -q -I dtb -O dts -o ../out/$b.decompiled.dts arch/arm64/boot/dts/$d
          done
          cp .config ../out/config
          cp ../source.txt ../out/
          echo "DTB_T=$(( $(date +%s) - T0 ))" >> "$GITHUB_ENV"
      - name: dtbs_check (non-fatal)
        continue-on-error: true
        run: |
          python3 -m venv ~/dtv && ~/dtv/bin/pip install -q dtschema yamllint
          export PATH=~/dtv/bin:$PATH
          cd src
          make -j$(nproc) CHECK_DTBS=y exynos/exynos7870-on7xelte.dtb 2>&1 | tee ../out/dtbs_check.txt
      - name: Package
        if: always()
        run: |
          cd out && sha256sum * > SHA256SUMS; ls -la
          w=$(grep -c -E 'warning|error|failed' dtbs_check.txt 2>/dev/null || true)
          {
            echo "### dtb \`$BUILD\`: \`$(sed -n 's/^commit: //p' ../source.txt | cut -c1-12)\` $REF, DTBs built in ${DTB_T:-?}s, dtbs_check: ${w:-n/a} warning/error lines"
            echo "<details><summary>dtbs_check output</summary>"; echo; echo '```'
            grep -E 'warning|error|failed' dtbs_check.txt 2>/dev/null | head -200 || true
            echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ matrix.build }}
          path: out/
          retention-days: 14
      - name: Release (opt-in)
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$BUILD-dtb-${{ github.run_number }}"
          gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file source.txt

  stock-module:
    needs: setup
    if: inputs.mode == 'stock-module'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODULES: ${{ inputs.modules }}
      FULL: ${{ inputs.full_modules }}
      EXPECT_RELEASE: "6.15.0-exynos7870"
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Toolchain (clang of the same major as the stock kernel)
        run: |
          set -euo pipefail
          v=$(sed -n 's/^CONFIG_CLANG_VERSION=//p' "$BASE_CONFIG"); v=$((v / 10000))
          echo "stock kernel was built with clang $v ($(sed -n 's/^CONFIG_CC_VERSION_TEXT=//p' "$BASE_CONFIG"))"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev kmod zstd ccache dwarves lsb-release wget gnupg software-properties-common >/dev/null
          if ! command -v clang-$v >/dev/null; then
            wget -q https://apt.llvm.org/llvm.sh
            sudo bash llvm.sh $v >/dev/null || echo "::warning::clang-$v not available from apt.llvm.org"
          fi
          if ! command -v clang-$v >/dev/null; then
            v=$(ls /usr/bin/clang-[0-9]* | sed 's/.*clang-//' | sort -n | tail -1)
            echo "::warning::falling back to clang-$v"
          fi
          sudo apt-get install -y -qq lld-$v llvm-$v >/dev/null || true
          clang-$v --version | head -1
          echo "LLVMSUFFIX=-$v" >> "$GITHUB_ENV"
      - name: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-stock-6.15-5686e3b5-${{ inputs.full_modules }}-${{ github.run_id }}
          restore-keys: |
            ccache-stock-6.15-5686e3b5-${{ inputs.full_modules }}-
            ccache-stock-6.15-5686e3b5-
      - name: Rebuild stock tree + modules, verify vermagic
        run: |
          export CCACHE_MAXSIZE=4G
          ccache -z >/dev/null
          bash scripts/stock-module.sh
      - name: Package
        if: always()
        run: |
          cd out 2>/dev/null && sha256sum * > SHA256SUMS && ls -la || true
          {
            echo "### stock-module (\`$MODULES\`, full=$FULL), $(( ($(date +%s) - T0) / 60 )) min"
            echo "expected vermagic: \`$(cat ~/stock/vermagic.txt 2>/dev/null)\`"; echo
            echo "| module | vermagic | size |"; echo "|---|---|---|"
            cat ~/stock/rows.md 2>/dev/null
            echo; echo '```'; cat source.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stock-modules-6.15.0-exynos7870
          path: out/
          retention-days: 30
      - name: Release (opt-in)
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stock-6.15.0-exynos7870-${{ github.run_number }}"
          gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file out/source.txt

  stable:
    needs: setup
    if: inputs.mode == 'stable'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    env:
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"; df -h / | tail -1; nproc
      - name: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache-stable
          key: ccache-stable-7.3.4-${{ matrix.build }}-${{ github.run_id }}
          restore-keys: |
            ccache-stable-7.3.4-${{ matrix.build }}-
            ccache-stable-7.3.4-
      - name: Build in Alpine edge (native arm64, LLVM=1 like the APKBUILD)
        run: |
          set -euo pipefail
          mkdir -p /home/runner/.cache/ccache-stable out
          PKGS="bash bison clang clang-libclang diffutils elfutils-dev findutils flex grep kmod linux-headers lld llvm
            openssl openssl-dev pahole perl python3 rust rust-bindgen rust-src rustfmt sed zstd xz tar curl patch ccache coreutils make gzip"
          docker run --rm -v "$PWD:/w" -v /home/runner/.cache/ccache-stable:/ccache -w /w \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=6G -e BUILD -e BUILD_DIR -e OUT=/w/out -e PKGS="$PKGS" \
            alpine:edge sh -euc 'apk add -q $PKGS && sh scripts/stable-build.sh'
          sudo chown -R "$(id -u):$(id -g)" out /home/runner/.cache/ccache-stable
          cd out && sha256sum * > SHA256SUMS && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.build }}
          path: out/
          retention-days: 3
      - name: Summary
        if: always()
        run: |
          {
            echo "### stable \`$BUILD\`: \`$(cat out/release.txt 2>/dev/null)\`, $(( ($(date +%s) - T0) / 60 )) min"
            echo '```'; cat out/source.txt 2>/dev/null; echo '```'
            echo "<details><summary>config diff vs config-stable.aarch64</summary>"; echo; echo '```'
            cat out/config.diff 2>/dev/null; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

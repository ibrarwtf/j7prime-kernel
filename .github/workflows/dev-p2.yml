name: dev-p2

# Compile test of the p2 series (Exynos 7870 TMU + cpufreq + cpuidle) on 7.3.4.
# Runs on pushes to the p2-dev branch only; independent of kernel.yml.
on:
  push:
    branches: [p2-dev]
  workflow_dispatch:
    inputs:
      full:
        description: "also package modules.tar.zst (large)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OUT: ${{ github.workspace }}/out
      FULL: ${{ inputs.full || 'false' }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Toolchain (LLVM from apt.llvm.org, dtschema)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio kmod zstd xz-utils ccache \
            python3-venv lsb-release wget gnupg software-properties-common >/dev/null
          wget -q https://apt.llvm.org/llvm.sh
          v=21
          sudo bash llvm.sh $v >/dev/null 2>&1 || echo "::warning::llvm.sh $v failed"
          if ! command -v clang-$v >/dev/null; then
            v=$(ls /usr/bin/clang-[0-9]* | sed 's/.*clang-//' | sort -n | tail -1)
            echo "::warning::falling back to clang-$v"
          fi
          sudo apt-get install -y -qq lld-$v llvm-$v >/dev/null || true
          clang-$v --version | head -1
          echo "LLVM_SUFFIX=-$v" >> "$GITHUB_ENV"
          python3 -m venv ~/dtv
          ~/dtv/bin/pip install -q dtschema yamllint
          echo "$HOME/dtv/bin" >> "$GITHUB_PATH"

      - name: ccache restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-p2-734-${{ github.run_id }}
          restore-keys: ccache-p2-734-

      - name: Fetch 7.3.4 + pmaports recipe, apply p2, build
        run: bash scripts/p2-build.sh

      - name: ccache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-p2-734-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### p2 on 7.3.4: \`$(cat out/release.txt 2>/dev/null || echo failed)\`, $(( ($(date +%s) - T0) / 60 )) min"
            echo '```'; cat out/source.txt 2>/dev/null || true; echo '```'
            echo "dtbs_check lines for p2 nodes: $(wc -l < out/dtbs_check.p2.log 2>/dev/null || echo n/a)"
            echo '```'; head -50 out/dtbs_check.p2.log 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cd out 2>/dev/null && sha256sum * > SHA256SUMS && ls -la || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-734
          path: out/
          retention-days: 3
